services:
  aifeed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aifeed
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - aifeed-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/data/aifeed.db
      # Optional: raise GitHub API rate limit from 60 to 5000 req/h
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Optional: enables Product Hunt source
      - PRODUCTHUNT_TOKEN=${PRODUCTHUNT_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.bluezee.project=aifeed"
      - "com.bluezee.managed=true"

volumes:
  aifeed-data:
    driver: local
