services:
  aifeed-api:
    build:
      context: ./apps/api
      dockerfile: ../../Dockerfile.api
    container_name: aifeed-api
    restart: unless-stopped
    volumes:
      - aifeed-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/data/aifeed.db
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - PRODUCTHUNT_TOKEN=${PRODUCTHUNT_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.bluezee.project=aifeed"
      - "com.bluezee.managed=true"

  aifeed-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: aifeed-web
    restart: unless-stopped
    ports:
      - "8181:80"
    depends_on:
      - aifeed-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.bluezee.project=aifeed"
      - "com.bluezee.managed=true"

volumes:
  aifeed-data:
    external: true
    name: aifeed_aifeed-data
